apiVersion: apps/v1
kind: Deployment
metadata:
  name: agente-financeiro
  labels:
    app: agente-financeiro
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agente-financeiro
  template:
    metadata:
      labels:
        app: agente-financeiro
    spec:
      containers:
        - name: agente-financeiro
          image: <seu-repositorio-ocir>/agente-financeiro:latest
          ports:
            - containerPort: 5000
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agente-financeiro-secrets
                  key: openai-api-key
            - name: TAVILY_SEARCH_API
              valueFrom:
                secretKeyRef:
                  name: agente-financeiro-secrets
                  key: tavily-api-key
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: agente-financeiro-service
spec:
  selector:
    app: agente-financeiro
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
  type: LoadBalancer
